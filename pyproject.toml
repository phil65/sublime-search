[project]
name = "sublime-search"
description = "Fast Rust-powered fuzzy matching, fuzzy search-and-replace and locationless diff application for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@googlemail.com" },
]
keywords = [
  "code-editing",
  "diff",
  "fuzzy",
  "fuzzy-matching",
  "fuzzy-search",
  "llm",
  "patch",
  "rust",
  "search-replace",
  "sublime-text",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/phil65/sublime-search#readme"
Homepage = "https://github.com/phil65/sublime-search"
Issues = "https://github.com/phil65/sublime-search/issues"
Source = "https://github.com/phil65/sublime-search"

[dependency-groups]
dev = ["maturin>=1.8,<2.0", "pytest", "pytest-cov"]

docs = [
  "mkdocs-material",
  "mkdocs-mknodes",
  # Only add below (Copier)
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sublime_search._sublime_search"
python-source = "python"
